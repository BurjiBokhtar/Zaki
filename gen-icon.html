<!DOCTYPE html><html><body>
<canvas id='c' width='512' height='512'></canvas>
<script>
var img=new Image();
var svg="<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 512 512\">\n  <defs>\n\n    <!-- Z segment: bright green (доходы / income) -->\n    <linearGradient id=\"gz\" x1=\"10%\" y1=\"0%\" x2=\"90%\" y2=\"100%\">\n      <stop offset=\"0%\" stop-color=\"#6EE8B5\"/>\n      <stop offset=\"50%\" stop-color=\"#39B980\"/>\n      <stop offset=\"100%\" stop-color=\"#1E7A50\"/>\n    </linearGradient>\n\n    <!-- A segment: blue-gray (расходы / expense) -->\n    <linearGradient id=\"ga\" x1=\"100%\" y1=\"0%\" x2=\"0%\" y2=\"100%\">\n      <stop offset=\"0%\" stop-color=\"#F2F7FC\"/>\n      <stop offset=\"55%\" stop-color=\"#DDE8F2\"/>\n      <stop offset=\"100%\" stop-color=\"#BDCFDF\"/>\n    </linearGradient>\n\n    <!-- K segment: deep green (управление / management) -->\n    <linearGradient id=\"gk\" x1=\"0%\" y1=\"100%\" x2=\"100%\" y2=\"0%\">\n      <stop offset=\"0%\" stop-color=\"#155C38\"/>\n      <stop offset=\"50%\" stop-color=\"#228C5C\"/>\n      <stop offset=\"100%\" stop-color=\"#30AF78\"/>\n    </linearGradient>\n\n    <!-- I segment: pale mint (простота / simplicity) -->\n    <linearGradient id=\"gi\" x1=\"0%\" y1=\"0%\" x2=\"100%\" y2=\"100%\">\n      <stop offset=\"0%\" stop-color=\"#AEDED0\"/>\n      <stop offset=\"100%\" stop-color=\"#79CBAE\"/>\n    </linearGradient>\n\n    <!-- Inner circle: frosted glass -->\n    <radialGradient id=\"rig\" cx=\"38%\" cy=\"32%\" r=\"68%\">\n      <stop offset=\"0%\"   stop-color=\"#FFFFFF\"/>\n      <stop offset=\"48%\"  stop-color=\"#F1F7FC\"/>\n      <stop offset=\"100%\" stop-color=\"#D4E4EF\"/>\n    </radialGradient>\n\n    <!-- Gloss overlay for green segments -->\n    <linearGradient id=\"gloss\" x1=\"0%\" y1=\"0%\" x2=\"60%\" y2=\"100%\">\n      <stop offset=\"0%\"   stop-color=\"rgba(255,255,255,0.30)\"/>\n      <stop offset=\"100%\" stop-color=\"rgba(255,255,255,0)\"/>\n    </linearGradient>\n\n    <!-- Drop shadow for donut ring -->\n    <filter id=\"fds\" x=\"-22%\" y=\"-18%\" width=\"144%\" height=\"150%\">\n      <feDropShadow dx=\"0\" dy=\"14\" stdDeviation=\"20\"\n                    flood-color=\"rgb(0,55,30)\" flood-opacity=\"0.22\"/>\n    </filter>\n\n    <!-- Soft shadow for inner ball -->\n    <filter id=\"fis\" x=\"-14%\" y=\"-12%\" width=\"128%\" height=\"128%\">\n      <feDropShadow dx=\"2\" dy=\"5\" stdDeviation=\"9\"\n                    flood-color=\"rgb(60,110,170)\" flood-opacity=\"0.20\"/>\n    </filter>\n\n    <filter id=\"fb5\"><feGaussianBlur stdDeviation=\"5\"/></filter>\n    <filter id=\"fb12\"><feGaussianBlur stdDeviation=\"12\"/></filter>\n\n  </defs>\n\n  <!-- Ground ambient shadow -->\n  <ellipse cx=\"258\" cy=\"490\" rx=\"180\" ry=\"16\"\n           fill=\"rgba(0,50,25,0.15)\" filter=\"url(#fb12)\"/>\n\n  <!-- ══════════════ 4 DONUT SEGMENTS ══════════════ -->\n  <!--\n    Layout (clockwise from top, SVG angles):\n      Z  275°→35°   span=120°  green     (income / доходы)\n      gap 35°→38°\n      A   38°→118°  span=80°   gray-blue (expenses / расходы)\n      gap 118°→121°\n      K  121°→211°  span=90°   dark-green(management / управление)\n      gap 211°→214°\n      I  214°→274°  span=60°   pale-mint (simplicity / простота)\n      gap 274°→275°\n\n    R=210 (outer)  r=135 (inner)  cx=cy=256\n\n    Computed arc endpoints:\n      275°: outer(274.3, 46.8)   inner(267.8,121.1)\n       35°: outer(428.0,376.5)   inner(366.6,333.4)\n       38°: outer(421.5,385.4)   inner(362.4,339.2)\n      118°: outer(157.5,441.4)   inner(192.7,375.2)\n      121°: outer(147.8,435.9)   inner(186.5,371.7)\n      211°: outer( 76.1,147.8)   inner(140.3,186.5)\n      214°: outer( 81.9,138.6)   inner(144.1,180.5)\n      274°: outer(270.7, 46.5)   inner(265.5,121.3)\n  -->\n  <g filter=\"url(#fds)\">\n\n    <!-- Z — доходы (green, 120° CW, large-arc=0) -->\n    <path d=\"M274.3,46.8\n             A210,210 0 0,1 428.0,376.5\n             L366.6,333.4\n             A135,135 0 0,0 267.8,121.1 Z\"\n          fill=\"url(#gz)\"/>\n\n    <!-- A — расходы (gray-blue, 80° CW, large-arc=0) -->\n    <path d=\"M421.5,385.4\n             A210,210 0 0,1 157.5,441.4\n             L192.7,375.2\n             A135,135 0 0,0 362.4,339.2 Z\"\n          fill=\"url(#ga)\"/>\n\n    <!-- K — управление (dark-green, 90° CW, large-arc=0) -->\n    <path d=\"M147.8,435.9\n             A210,210 0 0,1  76.1,147.8\n             L140.3,186.5\n             A135,135 0 0,0 186.5,371.7 Z\"\n          fill=\"url(#gk)\"/>\n\n    <!-- I — простота (pale-mint, 60° CW, large-arc=0) -->\n    <path d=\"M81.9,138.6\n             A210,210 0 0,1 270.7, 46.5\n             L265.5,121.3\n             A135,135 0 0,0 144.1,180.5 Z\"\n          fill=\"url(#gi)\"/>\n\n  </g>\n\n  <!-- Specular gloss on top of Z segment -->\n  <path d=\"M274.3,46.8 A210,210 0 0,1 390,240 L340,230 A135,135 0 0,0 267.8,121.1 Z\"\n        fill=\"url(#gloss)\"/>\n\n  <!-- ══════════════ LETTERS on segments — rotated along arc ══════════════ -->\n  <!-- Z on bright-green — white, rotate 65° -->\n  <text x=\"412\" y=\"183\" text-anchor=\"middle\" dominant-baseline=\"central\"\n        font-family=\"'Arial Black','Impact',sans-serif\" font-weight=\"900\"\n        font-size=\"52\" fill=\"#FFFFFF\" opacity=\"0.95\"\n        transform=\"rotate(65,412,183)\">Z</text>\n\n  <!-- A on light-gray — dark blue text for contrast, rotate 168° -->\n  <text x=\"292\" y=\"425\" text-anchor=\"middle\" dominant-baseline=\"central\"\n        font-family=\"'Arial Black','Impact',sans-serif\" font-weight=\"900\"\n        font-size=\"48\" fill=\"#4A6A88\" opacity=\"0.90\"\n        transform=\"rotate(168,292,425)\">A</text>\n\n  <!-- K on dark-green — white, rotate 256° -->\n  <text x=\"89\" y=\"298\" text-anchor=\"middle\" dominant-baseline=\"central\"\n        font-family=\"'Arial Black','Impact',sans-serif\" font-weight=\"900\"\n        font-size=\"50\" fill=\"#FFFFFF\" opacity=\"0.95\"\n        transform=\"rotate(256,89,298)\">K</text>\n\n  <!-- I on pale-mint — deep green text, rotate 334° -->\n  <text x=\"180\" y=\"101\" text-anchor=\"middle\" dominant-baseline=\"central\"\n        font-family=\"'Arial Black','Impact',sans-serif\" font-weight=\"900\"\n        font-size=\"44\" fill=\"#1A6040\" opacity=\"0.90\"\n        transform=\"rotate(334,180,101)\">I</text>\n\n  <!-- ══════════════ INNER FROSTED BALL ══════════════ -->\n  <circle cx=\"256\" cy=\"256\" r=\"128\" fill=\"url(#rig)\" filter=\"url(#fis)\"/>\n\n  <!-- Specular reflection highlight -->\n  <ellipse cx=\"213\" cy=\"206\" rx=\"56\" ry=\"36\"\n           fill=\"rgba(255,255,255,0.58)\"\n           transform=\"rotate(-38,213,206)\"\n           filter=\"url(#fb5)\"/>\n\n  <!-- Thin inner rim -->\n  <circle cx=\"256\" cy=\"256\" r=\"126\"\n          fill=\"none\" stroke=\"rgba(100,140,180,0.15)\" stroke-width=\"3\"/>\n\n  <!-- ══════════════ CENTER: income ↑ and expense ↓ separated ══════════════ -->\n  <!-- Income arrow ↑ (upper half) -->\n  <path d=\"M256,196 L238,218 L248,218 L248,248 L264,248 L264,218 L274,218 Z\"\n        fill=\"#39B980\" opacity=\"0.92\"/>\n  <!-- Thin separator line -->\n  <line x1=\"234\" y1=\"256\" x2=\"278\" y2=\"256\"\n        stroke=\"rgba(150,180,210,0.35)\" stroke-width=\"1.5\"/>\n  <!-- Expense arrow ↓ (lower half) -->\n  <path d=\"M256,316 L238,294 L248,294 L248,264 L264,264 L264,294 L274,294 Z\"\n        fill=\"#7A9DB8\" opacity=\"0.72\"/>\n\n</svg>\n";
var blob=new Blob([svg],{type:'image/svg+xml'});
var url=URL.createObjectURL(blob);
img.onload=function(){
  var c=document.getElementById('c');
  var ctx=c.getContext('2d');
  ctx.drawImage(img,0,0,512,512);
  var a=document.createElement('a');
  a.download='logo.png';
  a.href=c.toDataURL('image/png');
  a.click();
};
img.src=url;
</script></body></html>
